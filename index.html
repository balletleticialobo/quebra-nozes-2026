<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartas Detalhe Quebra-Nozes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=EB+Garamond:wght@400;500;600;700&display=swap">
<style>
/* Layout: programa de teatro em veludo bordô, moldura dourada fina; ornamentos só nos títulos, texto creme grande e limpo */
:root{
  --velvet-1:#4f0f19;    /* bordô veludo, topo */
  --velvet-2:#3b0a12;    /* bordô veludo, meio */
  --velvet-3:#2a060c;    /* bordô veludo, base */
  --panel:rgba(22,3,7,.38);       /* painéis sobre o veludo */
  --panel-2:rgba(22,3,7,.55);     /* destaque (itens dos pais) */
  --gold:#e9c98a;        /* dourado: títulos, ícones, rótulos */
  --gold-line:rgba(233,201,138,.42); /* filetes dourados */
  --gold-faint:rgba(233,201,138,.18);
  --text:#fbf1e3;        /* texto principal */
  --soft:#efdcc6;        /* texto secundário, ainda bem legível */
  --display:"Cormorant SC", "Times New Roman", serif;
  --script:"Cormorant Garamond", Georgia, serif;
  --body:"EB Garamond", Georgia, "Times New Roman", serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--velvet-3)}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse 110% 55% at 50% 0%, rgba(170,44,58,.35), transparent 65%),
    radial-gradient(ellipse 80% 60% at 50% 110%, rgba(0,0,0,.45), transparent 70%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.09) 0 2px, transparent 2px 8px),
    linear-gradient(180deg, var(--velvet-1) 0%, var(--velvet-2) 45%, var(--velvet-3) 100%);
  background-color:var(--velvet-2);
  color:var(--text);font-family:var(--body);font-size:19px;line-height:1.6;font-weight:500;
}
/* moldura fixa da página */
.frame-deco{position:fixed;pointer-events:none;z-index:0;
  top:calc(8px + env(safe-area-inset-top, 0px));bottom:calc(8px + env(safe-area-inset-bottom, 0px));
  left:calc(8px + env(safe-area-inset-left, 0px));right:calc(8px + env(safe-area-inset-right, 0px));
  border:1px solid var(--gold-line);outline:1px solid var(--gold-faint);outline-offset:-5px}
.frame-deco svg{position:absolute;width:34px;height:34px;color:var(--gold)}
.frame-deco .tl{top:-1px;left:-1px}.frame-deco .tr{top:-1px;right:-1px;transform:scaleX(-1)}
.frame-deco .bl{bottom:-1px;left:-1px;transform:scaleY(-1)}.frame-deco .br{bottom:-1px;right:-1px;transform:scale(-1,-1)}
.curtain{position:fixed;top:0;bottom:0;width:70px;pointer-events:none;z-index:0;display:none;
  background:repeating-linear-gradient(90deg,#5c0c18 0 9px,#3a050d 9px 18px,#6d1422 18px 24px);
  box-shadow:inset -18px 0 30px rgba(0,0,0,.55)}
.curtain.l{left:0}.curtain.r{right:0;transform:scaleX(-1)}
@media (min-width:980px){.curtain{display:block}}

.wrap{position:relative;z-index:1;width:100%;max-width:748px;margin:0 auto;padding-block:0 56px;
  padding-left:max(22px, env(safe-area-inset-left, 0px));padding-right:max(22px, env(safe-area-inset-right, 0px))}
@media (max-width:400px){.wrap{padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px))}}
.banner{position:relative;z-index:1;width:100%;margin-top:calc(-1 * env(safe-area-inset-top, 0px));background:#2a050b;overflow:hidden}
.banner img{display:block;width:100%;max-width:none;height:auto;
  }
.banner{-webkit-mask-image:linear-gradient(180deg,#000 96%,transparent 100%);mask-image:linear-gradient(180deg,#000 96%,transparent 100%)}
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-y pinch-zoom}
.wrap *{min-width:0;overflow-wrap:break-word}
.list a,.who > div,.alert{min-width:0}
.arab{position:fixed;top:0;bottom:0;width:24px;pointer-events:none;z-index:0;opacity:.55;
  background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%20160%22%20fill%3D%22none%22%20stroke%3D%22%23e9c98a%22%20stroke-width%3D%220.9%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M12%200v160%22/%3E%3Cpath%20d%3D%22M12%2022c-7%200-10-6-7-9s7%201%204%203%22/%3E%3Cpath%20d%3D%22M12%2030c-4%202-6%206-4%209%22/%3E%3Cpath%20d%3D%22M12%20102c7%200%2010-6%207-9s-7%201-4%203%22/%3E%3Cpath%20d%3D%22M12%20110c4%202%206%206%204%209%22/%3E%3Cpath%20d%3D%22M12%2062l3.5%206-3.5%206-3.5-6z%22%20fill%3D%22%23e9c98a%22%20fill-opacity%3D%22.35%22/%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%22140%22%20r%3D%221.2%22%20fill%3D%22%23e9c98a%22/%3E%3Cpath%20d%3D%22M12%2052c-3-1-4-3-3-4M12%2084c3%201%204%203%203%204%22/%3E%3C/svg%3E") center top/24px 160px repeat-y;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 85%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 85%,transparent 100%)}
.arab.l{left:calc(1px + env(safe-area-inset-left, 0px))}
.arab.r{right:calc(1px + env(safe-area-inset-right, 0px));transform:scaleX(-1)}
@media (min-width:760px){.arab{width:28px;background-size:28px 186px;opacity:.6}.arab.l{left:calc(50% - 400px)}.arab.r{right:calc(50% - 400px)}}

/* nome das coreografias em dourado */
.gold{background:linear-gradient(180deg,#fff3cf 0%,#f0cf8a 35%,#c8964a 62%,#f6dc9e 82%,#d9ab5e 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(60,20,0,.6)) drop-shadow(0 3px 8px rgba(0,0,0,.4))}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.orn{display:block;margin:0 auto;color:var(--gold);fill:none;stroke:currentColor;stroke-width:1.1}

/* cabeçalho */
.show{text-align:center;display:grid;gap:8px;padding-bottom:6px}
.show .kicker{font-family:var(--display);color:var(--gold);letter-spacing:.32em;font-size:15px;font-weight:600;line-height:1.5}
.show h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,11vw,68px);line-height:1;margin:2px 0 0;text-wrap:balance;
  background:linear-gradient(180deg,#fff0c9 0%,#e9c27a 48%,#b9863f 70%,#f2d495 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.45))}
.show .meta{font-family:var(--display);color:var(--text);letter-spacing:.18em;font-size:16px;font-weight:600;line-height:1.5}
.show .meta span{color:var(--gold);padding-inline:6px}

/* índice */
.index{padding-top:28px;display:grid;gap:22px}
.lead{text-align:center;display:grid;gap:2px}
.lead em{font-family:var(--script);font-size:24px;color:var(--text);font-weight:600}
.lead small{font-size:17px;color:var(--soft)}
.heading{display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--display);color:var(--gold);font-size:24px;letter-spacing:.22em;font-weight:600}
.heading svg{width:56px;height:18px;flex:none}
.heading svg.flip{transform:scaleX(-1)}
@media (max-width:420px){.heading{font-size:20px;letter-spacing:.14em;gap:8px}.heading svg{width:36px}}
.list{display:grid;gap:10px;list-style:none;padding:0;margin:0}
.list a{display:grid;grid-template-columns:30px minmax(0,1fr) 18px;align-items:center;gap:16px;
  background:var(--panel);border:1px solid var(--gold-line);border-radius:10px;padding:14px 16px;
  color:var(--text);text-decoration:none;transition:border-color .2s,background .2s}
.list a:hover,.list a:focus-visible{border-color:var(--gold);background:var(--panel-2);outline:none}
.list .ic{color:var(--gold);display:flex}
.list .mid{display:grid;gap:2px;min-width:0}
.list b{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.06em;line-height:1.15}
.list span.t{font-size:16px;color:var(--soft);line-height:1.35}
.list .chev{color:var(--gold)}
@media (min-width:640px){
  .list .mid{grid-template-columns:220px 1fr;align-items:center;gap:16px}
  .list span.t{border-left:1px solid var(--gold-line);padding-left:16px}
}

/* carta */
.card{padding-top:32px;display:grid;gap:30px}
.title{text-align:center;display:grid;gap:4px;justify-items:center}
.title .badge{color:var(--gold);width:54px;height:54px;border:1px solid var(--gold-line);border-radius:50%;display:grid;place-items:center;margin-bottom:6px}
.title .badge svg.i{width:28px;height:28px}
.eyebrow{font-family:var(--display);color:var(--gold);letter-spacing:.32em;font-size:15px;font-weight:600}
.title h2{display:flex;align-items:center;gap:12px;font-family:var(--display);color:var(--text);font-weight:700;font-size:clamp(34px,9vw,52px);line-height:1.05;margin:0;text-wrap:balance}
.title h2 svg{width:46px;height:16px;flex:none;color:var(--gold)}
.title h2 svg.flip{transform:scaleX(-1)}
@media (max-width:440px){.title h2 svg{display:none}}

.who{display:grid;gap:0;margin:0;background:var(--panel);border:1px solid var(--gold-line);border-radius:10px;padding:4px 18px}
.who > div{display:grid;grid-template-columns:28px 130px minmax(0,1fr);gap:12px;align-items:center;padding:12px 0}
.who > div + div{border-top:1px solid var(--gold-faint)}
.who .ic{color:var(--gold);display:flex}
.who dt{font-family:var(--display);color:var(--gold);font-size:15px;letter-spacing:.16em;font-weight:600}
.who dd{margin:0;font-weight:600;color:var(--text)}
@media (max-width:520px){.who > div{grid-template-columns:28px minmax(0,1fr);row-gap:0}.who dd{grid-column:2}}

.letter{margin:0;text-align:center;font-family:var(--script);font-style:italic;font-weight:600;font-size:22px;line-height:1.5;color:var(--text);text-wrap:pretty}
.letter b{font-weight:600;color:var(--gold)}

.photo{margin:0;display:grid;gap:10px;justify-items:center}
.photo .ph,.photo img{width:100%;max-width:100%;border:1px solid var(--gold);outline:1px solid var(--gold-faint);outline-offset:5px;border-radius:2px;display:block}
.photo .ph{aspect-ratio:4/5;display:grid;place-items:center;align-content:center;gap:10px;text-align:center;padding:24px;
  background:radial-gradient(ellipse at 50% 40%, rgba(233,201,138,.10), rgba(0,0,0,.30) 75%);
  color:var(--soft);font-family:var(--script);font-style:italic;font-size:22px;font-weight:600}
.photo .ph svg{width:120px;height:20px}
.photo.small .ph{max-width:340px}
.photo .pics{display:grid;gap:14px;width:100%;justify-items:center}
.photo .pics.n2{grid-template-columns:1fr 1fr;max-width:560px}
.photo .pics.n2 img{max-width:100%}
.photo.small .pics.n1 img{max-width:420px}
@media (max-width:420px){.photo .pics.n2{gap:10px}}
.photo figcaption{font-family:var(--display);color:var(--gold);font-size:14px;letter-spacing:.26em;font-weight:600;margin-top:6px}

section.block{display:grid;gap:16px}
.block h3{margin:0;display:flex;align-items:center;gap:14px;font-family:var(--display);color:var(--gold);font-weight:600;font-size:23px;letter-spacing:.2em}
.block h3 .num{width:40px;height:40px;flex:none;border:1px solid var(--gold-line);border-radius:50%;display:grid;place-items:center;font-size:17px;letter-spacing:0;color:var(--gold)}
.block h3 .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--gold-line),transparent);min-width:20px}
ul.items{list-style:none;margin:0;padding:0 0 0 4px;display:grid}
ul.items li{padding:7px 0;display:flex;gap:14px;align-items:baseline}
ul.items li::before{content:"✦";color:var(--gold);font-size:14px;flex:none}
.opc{color:var(--soft);font-style:italic;font-weight:400}
.box{background:var(--panel-2);border:1px solid var(--gold-line);border-radius:10px;padding:16px 20px;display:grid;gap:6px}
.box .label{font-family:var(--display);font-weight:600;color:var(--gold);font-size:16px;letter-spacing:.14em;padding-bottom:8px;border-bottom:1px solid var(--gold-faint)}
.acc{background:var(--panel);border:1px solid var(--gold-line);border-radius:10px;padding:16px 20px;display:grid;gap:4px}
.acc .tag{font-family:var(--display);font-size:14px;letter-spacing:.2em;color:var(--gold);font-weight:600}
.acc .name{font-weight:700;font-size:21px}
.acc p{margin:0}
.text{margin:0}
.text b{color:#fff;font-weight:700}
.note{margin:0;font-family:var(--script);font-style:italic;font-weight:600;font-size:20px;color:var(--soft);border-left:2px solid var(--gold);padding-left:14px}
.alert{background:var(--panel);border:1px solid var(--gold-line);border-radius:10px;padding:18px 20px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px}
.alert .ic{color:var(--gold)}
.alert p{margin:0}
.alert b{color:#fff}

.foot{padding-top:34px;text-align:center;color:var(--soft);font-size:18px;display:grid;gap:22px}
.foot > span{font-family:var(--script);font-style:italic;font-weight:600;font-size:21px}
/* palco com cortinas presas */
.stage{position:relative;overflow:hidden;border-radius:6px;border:1px solid var(--gold-line);min-height:250px;
  display:grid;place-items:center;padding:56px 18% 30px;
  background:radial-gradient(ellipse 60% 70% at 50% 45%, rgba(255,190,120,.16), transparent 70%),
             radial-gradient(ellipse at 50% 110%, #12020500 0%, rgba(0,0,0,.55) 80%), #24050b}
.drape{position:absolute;top:0;bottom:0;width:100%;
  background:repeating-linear-gradient(90deg,#7a1424 0 7px,#4a0812 7px 13px,#8c1a2b 13px 17px,#5a0b16 17px 22px);
  box-shadow:inset 0 0 40px rgba(0,0,0,.5)}
.drape.l{left:0;clip-path:polygon(0 0,40% 0,30% 22%,17% 46%,12% 56%,15% 70%,22% 100%,0 100%)}
.drape.r{right:0;clip-path:polygon(100% 0,60% 0,70% 22%,83% 46%,88% 56%,85% 70%,78% 100%,100% 100%)}
.valance{position:absolute;top:0;left:0;right:0;height:38px;z-index:2;
  background:radial-gradient(circle at 50% 0, #8c1a2b 0 26px, transparent 27px) 0 0/56px 38px repeat-x;
  border-top:3px solid #b78a45}
.valance::after{content:"";position:absolute;left:0;right:0;top:0;height:30px;
  background:radial-gradient(circle at 50% 0, transparent 25px, rgba(233,201,138,.6) 26px, transparent 27.5px) 0 0/56px 38px repeat-x}
.tassel{position:absolute;top:53%;width:10px;height:34px;z-index:2;
  background:linear-gradient(#f2d495,#b9863f);border-radius:5px 5px 2px 2px;
  clip-path:polygon(30% 0,70% 0,70% 30%,100% 100%,0 100%,30% 30%)}
.tassel.l{left:11%}.tassel.r{right:11%}
.spark{position:absolute;color:var(--gold);opacity:.7;font-size:13px;z-index:1}
.s1{top:30%;left:27%}.s2{top:22%;right:28%;font-size:16px}.s3{bottom:22%;left:30%;font-size:10px}.s4{bottom:30%;right:26%}.s5{top:58%;right:33%;font-size:9px;opacity:.5}
.stage-in{position:relative;z-index:1;display:grid;gap:4px;justify-items:center}
.stage-in b{font-family:var(--display);color:var(--gold);font-weight:600;letter-spacing:.3em;font-size:13px}
.stage-in small{font-family:var(--display);color:var(--text);letter-spacing:.22em;font-size:12px;font-weight:600}
.stage-in small.d{letter-spacing:.14em;line-height:1.6;margin-top:2px}
.stage-title{font-family:var(--display);font-weight:700;font-size:clamp(28px,8vw,44px);line-height:1.05;margin:4px 0;
  background:linear-gradient(180deg,#fff0c9 0%,#e9c27a 48%,#b9863f 70%,#f2d495 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
@media (max-width:480px){.stage{padding-inline:20%}.stage-in b{font-size:11px;letter-spacing:.2em}.stage-in small{font-size:11px;letter-spacing:.12em}}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

    <symbol id="div" viewBox="0 0 320 22"><path d="M0 11h118M202 11h118"/><path d="M118 11c8-9 20-9 22 0c-4 5-10 4-10-1M202 11c-8-9-20-9-22 0c4 5 10 4 10-1"/><path d="M160 3l8 8-8 8-8-8z"/><circle cx="160" cy="11" r="2"/></symbol>

const plural = s => /( e |,)/.test(s);
function quem(c){
  const rows=[];
  if(c.bailarina) rows.push(`<div><span class="ic">${ic("turma")}</span><dt>BAILARINA</dt><dd>${c.bailarina}</dd></div>`);
  if(c.turma) rows.push(`<div><span class="ic">${ic("turma")}</span><dt>${plural(c.turma)?'TURMAS':'TURMA'}</dt><dd>${c.turma}</dd></div>`);
  if(c.prof) rows.push(`<div><span class="ic">${ic("prof")}</span><dt>${plural(c.prof)?'PROFESSORAS':'PROFESSORA'}</dt><dd>${c.prof}</dd></div>`);
  return rows.length?`<dl class="who">${rows.join("")}</dl>`:"";
}
function foto(src, legenda, small){
  if(src===null) return "";
  const lista = Array.isArray(src) ? src.filter(Boolean) : (src ? [src] : []);
  const body = lista.length
    ? `<div class="pics n${lista.length}">${lista.map((u,i)=>`<img src="${u}" alt="${legenda}${lista.length>1?' '+(i+1):''}" loading="lazy">`).join("")}</div>`
    : `<div class="ph"><svg class="orn"><use href="#div"/></svg>Foto em breve<svg class="orn"><use href="#div"/></svg></div>`;
  return `<figure class="photo${small?' small':''}">${body}<figcaption>${legenda.toUpperCase()}</figcaption></figure>`;
}
function itens(arr){return `<ul class="items">${arr.map(([t,o])=>`<li><span>${t}${o?' <span class="opc">(opcional)</span>':''}</span></li>`).join("")}</ul>`}
const h3 = (n,t) => `<h3><span class="num">${n}</span><span>${t}</span><span class="rule"></span></h3>`;

function carta(c){
  const m=c.maq;
  return `
  <article class="card">
    <div class="title">
      <div class="badge">${ic(c.slug)}</div>
      <div class="eyebrow">COREOGRAFIA</div>
      <h2><svg class="orn"><use href="#swirl"/></svg><span class="gold">${c.nome}</span><svg class="orn flip"><use href="#swirl"/></svg></h2>
    </div>
    ${quem(c)}
    <p class="letter">Prezados pais e responsáveis, enviamos este informativo com todos os detalhes do espetáculo <b>O Quebra-Nozes</b>, para que todas as alunas estejam impecáveis e preparadas.</p>
    ${foto(c.fotos.figurino,"Figurino oficial")}

    <section class="block">
      ${h3("01","FIGURINO")}
      ${itens([["Figurino da coreografia"],["Calcinha bege lisa"]])}
      <div class="box">
        <div class="label">ITENS A SEREM ADQUIRIDOS PELOS RESPONSÁVEIS</div>
        ${itens(c.pais.map(p=>[p]))}
      </div>
    </section>

    <section class="block">
      ${h3("02","ACESSÓRIOS")}
      ${c.acc.map(a=>`<div class="acc"><div class="tag">✦ PEÇA OBRIGATÓRIA</div><div class="name">${a.n}</div>${a.d?`<p>${a.d}</p>`:''}</div>`).join("")}
    </section>

    <section class="block">
      ${h3("03","PENTEADO")}
      ${foto(c.fotos.penteado,"Referência de penteado",true)}
      <p class="text">O cabelo deve estar todo preso em um <b>${c.coque}</b>${CAUDA_PENTEADO}</p>
      <p class="note">Qualquer dúvida de como fazer, procure a professora de sua filha.</p>
    </section>

    <section class="block">
      ${h3("04","MAQUIAGEM")}
      ${foto(c.fotos.maquiagem,"Referência de maquiagem",true)}
      <p class="text">${m.intro||'A maquiagem segue a paleta de cores do figurino:'}</p>
      ${itens(m.itens)}
      ${m.nota?`<p class="note">${m.nota}</p>`:''}
    </section>

    <section class="block">
      ${h3("05","OBSERVAÇÕES")}
      <div class="alert"><span class="ic">${ic("alerta")}</span>
        <p>Não recomendamos o uso de <b>joias ou bijuterias</b> (brincos, anéis, cordão, pulseiras etc.), pois não nos responsabilizamos por objetos perdidos ou deixados no local. Também <b>não usar esmalte nas unhas</b>, para padronizar o figurino.</p>
      </div>
    </section>
  </article>`;
}

const elIndex=document.getElementById("index"), elCard=document.getElementById("card");
document.getElementById("list").innerHTML = CARTAS.map(c=>`<li><a href="#${c.slug}"><span class="ic">${ic(c.slug)}</span><span class="mid"><b class="gold">${c.nome}</b><span class="t">${c.turma||c.bailarina||"Elenco"}</span></span><span class="chev">${ic("chev")}</span></a></li>`).join("");

function route(){
  const slug=(location.hash||"").slice(1);
  const c=CARTAS.find(x=>x.slug===slug);
  if(c){ elCard.innerHTML=carta(c); elCard.hidden=false; elIndex.hidden=true; document.title=c.nome+" · O Quebra-Nozes"; window.scrollTo(0,0); }
  else { elCard.hidden=true; elIndex.hidden=false; document.title="Cartas Detalhe Quebra-Nozes"; }
}
addEventListener("hashchange",route); route();
</script>
